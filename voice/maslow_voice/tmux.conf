# Voice's private tmux server keeps the person's look and keys, then fixes the
# settings that keep each agent window bound to its own session.
source-file -q ~/.tmux.conf
source-file -q ~/.config/tmux/tmux.conf
# Close the viewer when its agent exits instead of switching to another agent.
set -g detach-on-destroy on
# Never keep a dead pane, so nothing typed can land after the agent exits.
set -g remain-on-exit off
